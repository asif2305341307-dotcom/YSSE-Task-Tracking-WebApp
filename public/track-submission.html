<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Submissions · YSSE Task Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html"><span class="dot"></span> YSSE Task Tracker</a>
      <nav class="nav" id="nav">
        <a href="intern-dashboard.html">Dashboard</a>
        <a href="submit-task.html">Submit Task</a>
        <a class="active" href="track-submission.html">Track</a>
        <button type="button" data-logout>Logout</button>
      </nav>
    </div>
  </header>

  <main class="page container" style="max-width:820px">
    <div class="page-head">
      <h1 style="font-size:1.8rem">Track Submissions</h1>
      <p class="muted" id="intro">Search by Intern ID to see submission status and admin feedback.</p>
    </div>

    <form id="search-form" class="search-row" novalidate>
      <input id="intern-id" type="text" placeholder="e.g. YSSE-2026-001" autocomplete="off" maxlength="20" aria-label="Intern ID">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>

    <div id="msg" class="msg" hidden></div>
    <div id="results"></div>
  </main>

  <script type="module" src="js/tracking.js"></script>
</body>
</html>
